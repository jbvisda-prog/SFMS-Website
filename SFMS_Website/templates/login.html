{% extends "base.html" %}{% block title %}Login | SFMS{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="eyebrow">PERSONAL FINANCE TRACKER</div><h1>Welcome back</h1>
  <p class="muted">Log in to manage your personal financial records.</p>
  <form method="post" class="stack">
    <label>Username<input name="username" minlength="3" maxlength="50" required autocomplete="username"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="primary">Log in</button>
  </form>
  <p class="center muted">No account yet? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
