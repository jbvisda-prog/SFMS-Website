{% extends "base.html" %}{% block title %}Register | SFMS{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="eyebrow">GET STARTED</div><h1>Create your account</h1>
  <p class="muted">Your records will be kept separate from other accounts.</p>
  <form method="post" class="stack">
    <label>Username<input name="username" minlength="3" maxlength="50" required autocomplete="username"></label>
    <label>Password<input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
    <label>Confirm password<input type="password" name="confirm_password" minlength="8" required autocomplete="new-password"></label>
    <button class="primary">Create account</button>
  </form>
  <p class="center muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
